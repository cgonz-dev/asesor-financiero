name: Copiloto Financiero CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://copiloto_ci:copiloto_ci_password@127.0.0.1:5432/copiloto_financiero_ci?schema=public

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: copiloto_financiero_ci
          POSTGRES_PASSWORD: copiloto_ci_password
          POSTGRES_USER: copiloto_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copiloto_ci -d copiloto_financiero_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply versioned database migrations
        run: pnpm db:migrate:deploy

      - name: Check database migration status
        run: pnpm db:status

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run integration tests
        run: pnpm test:integration

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Build workspaces
        run: pnpm build

      - name: Generate OpenAPI
        run: pnpm openapi:generate

      - name: Verify generated OpenAPI is current
        run: |
          if ! git diff --exit-code -- apps/api/openapi/openapi.json; then
            echo "::error file=apps/api/openapi/openapi.json::OpenAPI generado difiere del artefacto versionado. Ejecuta 'pnpm openapi:generate' y confirma el cambio."
            exit 1
          fi

      - name: Check OpenAPI
        run: pnpm openapi:check

      - name: Check peer dependencies
        run: pnpm peers check
